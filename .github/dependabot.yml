# Dependency update PRs. Every version update for mix and npm lands in ONE
# weekly PR (the `all-dependencies` multi-ecosystem group), so review that PR as
# a batch: it can include 0.x "minor" bumps that are breaking (req 0.5 -> 0.7
# was), so read the changelogs of anything below 1.0.
#
# GitHub Actions get their own weekly PR (the `github-actions` group). They used
# to ride in `all-dependencies`, where a risky Hex bump could hold them back:
# closing that batch dropped the action bumps with it and left CI on releases
# that target the deprecated Node.js 20 runtime.
#
# Version updates are limited to minor and patch releases (the `allow` rule on
# each entry): Dependabot cannot tell whether a major release breaks us, so
# majors are bumped by hand, with the changelog read and the code adapted in the
# same PR. `allow` update-types do not filter security updates, so for npm and
# GitHub Actions a security fix still arrives even when it is only in a new
# major. mix never gets security updates (see below): a vulnerable Hex package
# fails the OSV lockfile scan in audit.yml (every PR, push to main, and weekly)
# and is upgraded by hand, major or not. A 0.x "minor" bump (0.8 -> 0.9) still
# counts as minor although it is often breaking.
#
# Security updates (raised from Dependabot alerts) are grouped too, into one PR
# per package manager and directory, via each entry's `security-updates` group.
# That mirrors the repo's "Grouped security updates" setting in config. mix gets
# none in practice: GitHub's dependency graph does not parse mix.lock, so Hex
# advisories are caught by .github/workflows/audit.yml instead.
#
# The Docker base images are not covered here: the Dockerfiles select them
# through ARGs (BUILDER_IMAGE / RUNNER_IMAGE), which Dependabot cannot follow,
# so bump ELIXIR_VERSION / OTP_VERSION / UBUNTU_VERSION by hand.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: mix
    directory: /app
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app/assets
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
