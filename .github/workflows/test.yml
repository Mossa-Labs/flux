name: Test

on:
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.19.6"
  OTP_VERSION: "28.5.0.8"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check AI context files are up to date
        working-directory: .
        run: scripts/gen_ai_context.sh --check

      # Runs before the build, and on every PR, because the cost of catching this
      # late is asymmetric: this repository is public and Apache-2.0, so a
      # reference to the private edition that reaches the published history
      # cannot be retracted from anyone's clone (MOS-595).
      - name: Check for references to the private edition
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # On a PR, also scan the commit MESSAGES being merged. A message is as
          # public as a file and far harder to fix afterwards — amending a merged
          # commit rewrites every SHA after it. The commit that first removed
          # these references quoted them in its own message, and a files-only
          # check passed it.
          if [ -n "$BASE" ]; then
            scripts/check_no_private_refs.sh "$BASE..HEAD"
          else
            scripts/check_no_private_refs.sh
          fi

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            app/deps
            app/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('app/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      # Fails when a locked package has a known security advisory (Hex 2.5+
      # reads them from OSV) or has been retired by its maintainers.
      - name: Check Hex packages for advisories and retirements
        run: mix hex.audit

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flux_test
          POSTGRES_HOST: localhost
        run: mix test
