name: Release (flux Community)

# Publishes the Community image from a tag (MOS-586).
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The published package inherits this repository's visibility, so the image is as
# public or private as the repo is. Changing that later is a visibility toggle on
# the package rather than new pipeline work.
#
# ONE ARCH PER NATIVE RUNNER, then a manifest merge. QEMU is not an option: the
# BEAM fails to boot under it ("failed_to_start_child,user,nouser" at the first
# `mix` call), which reproduces with the stock hexpm/elixir image and is a
# platform limitation rather than something the Dockerfile can fix.
#
# Everything is built from this repository's own source: no SSH key, no git
# dependency and no pinned external revision to resolve, so a release is
# reproducible from its tag alone.
#
# THIRD-PARTY ACTIONS ARE PINNED BY COMMIT SHA, not by tag. A tag is mutable: the
# owner (or anyone who compromises the account) can repoint it, and the next
# release would silently run different code inside a job holding `packages:
# write`. The trailing `# v4` comments record the intended version for humans;
# only the SHA is authoritative.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v), e.g. 0.2.0-rc1"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mossa-labs/flux/community

jobs:
  build:
    strategy:
      # Never publish a half-built manifest: if one architecture fails, the other
      # must not be tagged and merged on its own.
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: meta
        env:
          # Passed through the environment, never interpolated into the script
          # body. `${{ }}` is substituted textually BEFORE the shell runs, so a
          # crafted dispatch input would execute inside the job that holds
          # `packages: write` and the deploy key.
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # A version reaches image tags and shell commands; keep it to what a
          # version can legitimately be.
          case "$VERSION" in
            *[!A-Za-z0-9.+_-]*|"") echo "::error::refusing suspicious version '$VERSION'"; exit 1 ;;
          esac

          {
            echo "version=$VERSION"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

          echo "Building $VERSION for ${{ matrix.arch }}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Context is app/ — the mix project lives there, not at the repo root.
          context: ./app
          file: ./app/Dockerfile.release
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          # Provenance was off because it was believed to complicate the manifest
          # merge. It does not: `imagetools create` copies every child of a source
          # index, attestation manifests included, keeping the
          # `vnd.docker.reference.digest` pointer intact. Verified on a local
          # registry — two attested single-arch indexes merge to one index with
          # four children, two of them attestations, and `.SBOM`/`.Provenance`
          # readable per platform on the result.
          #
          # mode=max because this is the open core: it embeds the Dockerfile and
          # build-arg values, all of which are already public here.
          provenance: mode=max
          sbom: true
          build-args: |
            FLUX_CORE_SHA=${{ github.sha }}
            FLUX_BUILD_TIME=${{ steps.meta.outputs.built_at }}
            FLUX_VERSION=${{ steps.meta.outputs.version }}
          # Scope bumped once when attestations were enabled. buildkit#4501
          # reports the gha cache silently degrading provenance; starting from a
          # clean scope avoids inheriting a pre-attestation entry. The step below
          # is what actually catches it if it recurs.
          cache-from: type=gha,scope=${{ matrix.arch }}-attest
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-attest

      # The version appears in four places and nothing ever compared them, so
      # 0.2.1 published an image whose label said 0.2.1 while the app, the boot
      # log and /app/releases/ all said 0.2.0. They had only ever agreed by
      # coincidence — mix.exs happened to carry the same number — so the defect
      # was invisible until a release actually changed the version.
      #
      # No BEAM boot and no database needed: all three reads are static.
      - name: Verify the image reports the version it is tagged with
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          V: ${{ steps.meta.outputs.version }}
        run: |
          LABEL="$(docker buildx imagetools inspect --format \
            '{{ index .Image.Config.Labels "org.opencontainers.image.version" }}' "$REF")"
          FILE="$(docker run --rm --entrypoint sh "$REF" -c '. /etc/flux-release; printf %s "$FLUX_VERSION"')"
          REL="$(docker run --rm --entrypoint awk "$REF" '{print $2}' /app/releases/start_erl.data)"

          echo "tag=$V  label=$LABEL  /etc/flux-release=$FILE  release=$REL"

          fail=0
          [ "$LABEL" = "$V" ] || { echo "::error::OCI label '$LABEL' != tag '$V'"; fail=1; }
          [ "$FILE"  = "$V" ] || { echo "::error::/etc/flux-release '$FILE' != tag '$V'"; fail=1; }
          [ "$REL"   = "$V" ] || { echo "::error::image boots release '$REL', tag is '$V'"; fail=1; }
          exit $fail

      # An attestation nobody checks is worse than none: it reads as assurance
      # while carrying none. buildkit#4501 reports the gha cache silently
      # producing empty provenance on a cache hit, which no other step here would
      # notice — the image builds, the tags publish, the manifest merges.
      - name: Assert the attestations are actually present
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "pushed $REF at ${DIGEST:-<no digest reported>}"

          fail=0
          for field in Provenance SBOM; do
            # `{}`, `null` and empty all mean "not there". Match on a character
            # that only real content has.
            if docker buildx imagetools inspect --format "{{json .$field}}" "$REF" \
                 | grep -q '[a-zA-Z0-9]'; then
              echo "  $field present"
            else
              echo "::error::$field attestation is empty for $REF (see buildkit#4501)"
              fail=1
            fi
          done
          exit $fail

  manifest:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          case "$VERSION" in
            *[!A-Za-z0-9.+_-]*|"") echo "::error::refusing suspicious version '$VERSION'"; exit 1 ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose the multi-arch manifest
        id: merge
        env:
          V: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$V" \
            "$IMAGE:$V-amd64" "$IMAGE:$V-arm64"

          # Until now nothing here surfaced a digest as a value — only as text
          # buried in the inspect dump. It is what a deployment pins to, and what
          # a future attestation will be issued over.
          DIGEST="$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "$IMAGE:$V")"
          case "$DIGEST" in
            sha256:[0-9a-f]*) ;;
            *) echo "::error::refusing an unexpected digest '$DIGEST'"; exit 1 ;;
          esac

          # `latest` only ever moves for a real release. A -rc / -beta build is
          # pullable by its exact version but must not become the default tag.
          case "$V" in
            *-*) echo "Pre-release $V — leaving :latest where it is" ;;
            *)
              docker buildx imagetools create -t "$IMAGE:latest" \
                "$IMAGE:$V-amd64" "$IMAGE:$V-arm64"

              # :latest and :$V are the same index only because two identical
              # merges produce identical bytes. Asserted rather than assumed:
              # attesting or signing one digest covers both tags only while that
              # holds, and if it stopped, :latest would silently be uncovered.
              L="$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "$IMAGE:latest")"
              [ "$L" = "$DIGEST" ] || {
                echo "::error::latest=$L differs from $V=$DIGEST; one attestation would not cover both"
                exit 1
              }
              ;;
          esac

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify the published manifest
        env:
          V: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          {
            echo "## Published \`$IMAGE:$V\`"
            echo
            echo "Index digest — quote this to pin a deployment:"
            echo
            echo "    $IMAGE@$DIGEST"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$V" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # A manifest missing an architecture is worse than a failed build: it
          # publishes something that will be pulled and found unrunnable.
          #
          # Attestation manifests show up as `unknown/unknown` rows in this same
          # output. That is expected and is how BuildKit stores them.
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "$IMAGE:$V" \
              | grep -q "linux/$arch" || { echo "::error::manifest is missing linux/$arch"; exit 1; }
          done
