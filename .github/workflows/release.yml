name: Release (flux Community)

# Publishes the Community image from a tag (MOS-586).
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The package took this repository's visibility once, when it was first created,
# and does not follow it afterwards. Its visibility is a setting on the package
# itself (public as of MOS-604) and is not something this pipeline controls.
#
# ONE ARCH PER NATIVE RUNNER, then a manifest merge. QEMU is not an option: the
# BEAM fails to boot under it ("failed_to_start_child,user,nouser" at the first
# `mix` call), which reproduces with the stock hexpm/elixir image and is a
# platform limitation rather than something the Dockerfile can fix.
#
# Everything is built from this repository's own source: no SSH key, no git
# dependency and no pinned external revision to resolve, so a release is
# reproducible from its tag alone.
#
# THIRD-PARTY ACTIONS ARE PINNED BY COMMIT SHA, not by tag. A tag is mutable: the
# owner (or anyone who compromises the account) can repoint it, and the next
# release would silently run different code inside a job holding `packages:
# write`. The trailing `# v4` comments record the intended version for humans;
# only the SHA is authoritative.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v), e.g. 0.2.0-rc1"
        required: true

permissions:
  contents: read
  packages: write

# One release of a given version at a time. A manual run checks that its
# version does not exist yet and then writes it; without this, a tag push for
# the same version could publish its signed index in between, and the manual
# run would overwrite it with an unsigned one. Keyed per version (a tag push
# and a dispatch of the same version normalise to the same group), so releases
# of different versions never queue behind, or cancel, one another.
concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mossa-labs/flux/community

jobs:
  build:
    strategy:
      # Never publish a half-built manifest: if one architecture fails, the other
      # must not be tagged and merged on its own.
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    # Each leg sets only its own key, so the two legs do not overwrite each
    # other. The manifest job composes from these digests, never from the
    # per-arch tags: a tag can be repointed between this job and that one, and
    # the release workflow would then attest whatever it had been pointed at.
    outputs:
      digest-amd64: ${{ steps.digest.outputs.amd64 }}
      digest-arm64: ${{ steps.digest.outputs.arm64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: meta
        env:
          # Passed through the environment, never interpolated into the script
          # body. `${{ }}` is substituted textually BEFORE the shell runs, so a
          # crafted dispatch input would execute inside the job that holds
          # `packages: write` and the deploy key.
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # A version reaches image tags and shell commands; keep it to what a
          # version can legitimately be.
          case "$VERSION" in
            *[!A-Za-z0-9.+_-]*|"") echo "::error::refusing suspicious version '$VERSION'"; exit 1 ;;
          esac

          {
            echo "version=$VERSION"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

          echo "Building $VERSION for ${{ matrix.arch }}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Context is app/ — the mix project lives there, not at the repo root.
          context: ./app
          file: ./app/Dockerfile.release
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          # Provenance was off because it was believed to complicate the manifest
          # merge. It does not: `imagetools create` copies every child of a source
          # index, attestation manifests included, keeping the
          # `vnd.docker.reference.digest` pointer intact. Verified on a local
          # registry — two attested single-arch indexes merge to one index with
          # four children, two of them attestations, and `.SBOM`/`.Provenance`
          # readable per platform on the result.
          #
          # mode=max because this is the open core: it embeds the Dockerfile and
          # build-arg values, all of which are already public here.
          provenance: mode=max
          sbom: true
          build-args: |
            FLUX_CORE_SHA=${{ github.sha }}
            FLUX_BUILD_TIME=${{ steps.meta.outputs.built_at }}
            FLUX_VERSION=${{ steps.meta.outputs.version }}
          # Scope bumped once when attestations were enabled. buildkit#4501
          # reports the gha cache silently degrading provenance; starting from a
          # clean scope avoids inheriting a pre-attestation entry. The step below
          # is what actually catches it if it recurs.
          cache-from: type=gha,scope=${{ matrix.arch }}-attest
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-attest

      - name: Export the ${{ matrix.arch }} digest
        id: digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in
            sha256:[0-9a-f]*) ;;
            *) echo "::error::refusing an unexpected digest '$DIGEST'"; exit 1 ;;
          esac
          echo "$ARCH=$DIGEST" >> "$GITHUB_OUTPUT"

      # The version appears in four places and nothing ever compared them, so
      # 0.2.1 published an image whose label said 0.2.1 while the app, the boot
      # log and /app/releases/ all said 0.2.0. They had only ever agreed by
      # coincidence — mix.exs happened to carry the same number — so the defect
      # was invisible until a release actually changed the version.
      #
      # No BEAM boot and no database needed: all three reads are static.
      - name: Verify the image reports the version it is tagged with
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          V: ${{ steps.meta.outputs.version }}
        run: |
          LABEL="$(docker buildx imagetools inspect --format \
            '{{ index .Image.Config.Labels "org.opencontainers.image.version" }}' "$REF")"
          FILE="$(docker run --rm --entrypoint sh "$REF" -c '. /etc/flux-release; printf %s "$FLUX_VERSION"')"
          REL="$(docker run --rm --entrypoint awk "$REF" '{print $2}' /app/releases/start_erl.data)"

          echo "tag=$V  label=$LABEL  /etc/flux-release=$FILE  release=$REL"

          fail=0
          [ "$LABEL" = "$V" ] || { echo "::error::OCI label '$LABEL' != tag '$V'"; fail=1; }
          [ "$FILE"  = "$V" ] || { echo "::error::/etc/flux-release '$FILE' != tag '$V'"; fail=1; }
          [ "$REL"   = "$V" ] || { echo "::error::image boots release '$REL', tag is '$V'"; fail=1; }
          exit $fail

      # An attestation nobody checks is worse than none: it reads as assurance
      # while carrying none. buildkit#4501 reports the gha cache silently
      # producing empty provenance on a cache hit, which no other step here would
      # notice — the image builds, the tags publish, the manifest merges.
      - name: Assert the attestations are actually present
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "pushed $REF at ${DIGEST:-<no digest reported>}"

          fail=0
          for field in Provenance SBOM; do
            # `{}`, `null` and empty all mean "not there". Match on a character
            # that only real content has.
            if docker buildx imagetools inspect --format "{{json .$field}}" "$REF" \
                 | grep -q '[a-zA-Z0-9]'; then
              echo "  $field present"
            else
              echo "::error::$field attestation is empty for $REF (see buildkit#4501)"
              fail=1
            fi
          done
          exit $fail

  manifest:
    needs: build
    runs-on: ubuntu-latest

    # A job-level block REPLACES the workflow-level one rather than adding to it,
    # so the two grants above are restated. The rest is for the attestation:
    # `id-token` mints the OIDC token Sigstore issues the certificate against,
    # `attestations` stores it, `artifact-metadata` records where the image lives.
    # Only this job signs; `build` keeps the narrower workflow-level grant.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Resolve version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          case "$VERSION" in
            *[!A-Za-z0-9.+_-]*|"") echo "::error::refusing suspicious version '$VERSION'"; exit 1 ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose the multi-arch manifest
        id: merge
        env:
          V: ${{ steps.meta.outputs.version }}
          AMD64: ${{ needs.build.outputs.digest-amd64 }}
          ARM64: ${{ needs.build.outputs.digest-arm64 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          for d in "$AMD64" "$ARM64"; do
            case "$d" in
              sha256:[0-9a-f]*) ;;
              *) echo "::error::build did not hand over a per-arch digest (got '$d')"; exit 1 ;;
            esac
          done

          # A manual run publishes unsigned (see the attest step), so it must not
          # take over a name users already trust: replacing an existing version
          # or moving :latest would swap a signed index for an unsigned one.
          #
          # Fails closed: only an explicit "not found" counts as absent. An auth
          # or network error must not read as "safe to publish".
          if [ "$EVENT_NAME" != "push" ]; then
            rc=0
            out="$(docker buildx imagetools inspect "$IMAGE:$V" 2>&1)" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::error::$IMAGE:$V already exists; a manual run will not overwrite a published version"
              exit 1
            elif ! printf '%s' "$out" | grep -qi 'not found'; then
              echo "::error::cannot tell whether $IMAGE:$V exists: $out"
              exit 1
            fi
          fi

          docker buildx imagetools create -t "$IMAGE:$V" \
            "$IMAGE@$AMD64" "$IMAGE@$ARM64"

          # The index digest is what a deployment pins to and what the attestation
          # below is issued over.
          DIGEST="$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "$IMAGE:$V")"
          case "$DIGEST" in
            sha256:[0-9a-f]*) ;;
            *) echo "::error::refusing an unexpected digest '$DIGEST'"; exit 1 ;;
          esac

          # DIGEST was read back through a tag, which can be repointed between
          # the create above and the inspect. Before it is attested, check that
          # the index at that (immutable) digest holds exactly the children of
          # the two builds and nothing else.
          children() { docker buildx imagetools inspect --raw "$1" | jq -r '.manifests[].digest'; }
          WANT="$( { children "$IMAGE@$AMD64"; children "$IMAGE@$ARM64"; } | sort)"
          GOT="$(children "$IMAGE@$DIGEST" | sort)"
          [ -n "$WANT" ] && [ "$WANT" = "$GOT" ] || {
            echo "::error::index $DIGEST is not the merge of $AMD64 and $ARM64"
            printf 'want:\n%s\ngot:\n%s\n' "$WANT" "$GOT"
            exit 1
          }

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Keyless: signed through Sigstore's public-good instance against this
      # workflow's OIDC identity, with an entry in the public transparency log.
      # No key or secret lives in this repository.
      #
      # Issued over the INDEX digest because that is what a tag resolves to, so
      # it is what a user verifies. The index commits to its children, so this
      # one attestation also covers both architectures and the BuildKit
      # provenance and SBOM attached to them.
      #
      # push-to-registry stores the bundle next to the image, not only in the
      # GitHub API. GHCR has no referrers API, so it lands under the fallback
      # `sha256-<hex>` tag; that tag is part of the release and must not be
      # pruned as an orphan.
      #
      # ONLY TAG PUSHES SIGN. A dispatch runs the workflow file from whatever
      # ref it is started on, edits included, yet would carry the same
      # signer-workflow identity. Its image is published but unsigned, and the
      # signature that is issued names refs/tags/v<version>, which is what
      # SECURITY.md tells users to pin with --source-ref.
      - name: Attest the published index
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      # Same discipline as the build job: every guarantee here fails silently,
      # so each one is checked, and each check is shown to be able to fail.
      #
      # The first command is the one SECURITY.md tells users to run. The
      # negative controls prove the verifier is actually discriminating — a
      # check that passes for a wrong identity or an unsigned image is no check.
      - name: Verify the attestation the way a user will
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.merge.outputs.digest }}
          AMD64: ${{ needs.build.outputs.digest-amd64 }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: |
          fail=0
          ok()  { echo "  ok: $1"; }
          bad() { echo "::error::$1"; fail=1; }

          # --- must pass ---------------------------------------------------
          gh attestation verify "oci://$IMAGE@$DIGEST" --owner "${REPO%%/*}" \
            && ok "documented command (--owner)" \
            || bad "attestation does not verify for $IMAGE@$DIGEST"

          gh attestation verify "oci://$IMAGE@$DIGEST" \
              --repo "$REPO" --signer-workflow "$WORKFLOW" --source-ref "$REF" \
            && ok "pinned to $WORKFLOW at $REF" \
            || bad "attestation was not signed by $WORKFLOW at $REF"

          gh attestation verify "oci://$IMAGE@$DIGEST" \
              --repo "$REPO" --signer-workflow "$WORKFLOW" --source-ref "$REF" \
              --bundle-from-oci \
            && ok "bundle fetched from the registry" \
            || bad "no attestation bundle in the registry; push-to-registry did not land"

          # --- must fail ---------------------------------------------------
          if gh attestation verify "oci://$IMAGE@$DIGEST" \
               --repo "$REPO" --signer-workflow "$REPO/.github/workflows/test.yml" >/dev/null 2>&1; then
            bad "verified against the wrong signer workflow; identity is not being checked"
          else
            ok "rejects the wrong signer workflow"
          fi

          if gh attestation verify "oci://$IMAGE@$DIGEST" \
               --repo "$REPO" --signer-workflow "$WORKFLOW" --source-ref refs/heads/main >/dev/null 2>&1; then
            bad "verified against the wrong source ref; the ref is not being checked"
          else
            ok "rejects the wrong source ref"
          fi

          if gh attestation verify "oci://$IMAGE@$AMD64" \
               --repo "$REPO" --signer-workflow "$WORKFLOW" >/dev/null 2>&1; then
            bad "an unattested per-arch image verified; the check proves nothing"
          else
            ok "rejects an image that was never attested"
          fi

          exit $fail

      - name: Verify the published manifest
        env:
          V: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          {
            echo "## Published \`$IMAGE:$V\`"
            echo
            echo "Index digest — quote this to pin a deployment:"
            echo
            echo "    $IMAGE@$DIGEST"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$V" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # A manifest missing an architecture is worse than a failed build: it
          # publishes something that will be pulled and found unrunnable.
          #
          # Attestation manifests show up as `unknown/unknown` rows in this same
          # output. That is expected and is how BuildKit stores them.
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "$IMAGE:$V" \
              | grep -q "linux/$arch" || { echo "::error::manifest is missing linux/$arch"; exit 1; }
          done

      # `latest` moves LAST, and only once the index it will point at is signed
      # and verified. Moving it earlier meant a Sigstore outage or a cancelled
      # run left the default tag on an unsigned image, with no rollback.
      #
      # Only for a real, tagged release. A -rc / -beta build is pullable by its
      # exact version but must not become the default tag, and neither may a
      # manual run (which is never signed).
      - name: Move latest to the signed release
        if: >-
          github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/v')
          && !contains(steps.meta.outputs.version, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.merge.outputs.digest }}
          AMD64: ${{ needs.build.outputs.digest-amd64 }}
          ARM64: ${{ needs.build.outputs.digest-arm64 }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: |
          docker buildx imagetools create -t "$IMAGE:latest" \
            "$IMAGE@$AMD64" "$IMAGE@$ARM64"

          # :latest and :$V are the same index only because two identical
          # merges produce identical bytes. Asserted rather than assumed: the
          # one attestation covers both tags only while that holds, and if it
          # stopped, :latest would silently be uncovered.
          L="$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "$IMAGE:latest")"
          [ "$L" = "$DIGEST" ] || {
            echo "::error::latest=$L differs from $V=$DIGEST; one attestation would not cover both"
            exit 1
          }

          gh attestation verify "oci://$IMAGE:latest" \
            --repo "$REPO" --signer-workflow "$WORKFLOW" --source-ref "$REF"
